<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Page Not Found | Serene Touch Pest Control</title>
  <meta name="robots" content="noindex" />
  <meta name="theme-color" content="#0e3a6b" />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Ccircle cx='16' cy='16' r='15' fill='white' stroke='%230e3a6b' stroke-width='2'/%3E%3Ctext x='16' y='23' font-family='Georgia,serif' font-size='20' font-weight='bold' fill='%2322c55e' text-anchor='middle'%3ES%3C/text%3E%3C/svg%3E" />
  <!-- Self-contained: GitHub Pages serves this for ANY missing path, so
       relative asset links could break. Everything is inline / absolute. -->
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
      font-family: "Segoe UI", system-ui, -apple-system, Roboto, sans-serif;
      color: #eaf2fb; text-align: center; line-height: 1.6;
      background:
        radial-gradient(900px 500px at 85% -10%, rgba(217,148,35,.18), transparent 60%),
        radial-gradient(700px 500px at 10% 110%, rgba(34,197,94,.22), transparent 55%),
        linear-gradient(160deg, #15448a, #0a2c54);
    }
    .card { max-width: 520px; }
    .mark {
      width: 76px; height: 76px; margin: 0 auto 18px; border-radius: 50%;
      background: #fff; border: 3px solid #0e3a6b; display: grid; place-items: center;
      font-family: Georgia, serif; font-weight: bold; font-size: 2.4rem; color: #22c55e;
    }
    .code { font-size: clamp(4rem, 14vw, 6.5rem); font-weight: 800; line-height: 1; margin: 0; color: #fff; }
    .code span { color: #d99423; }
    h1 { font-size: 1.5rem; margin: 10px 0 8px; color: #fff; }
    p { margin: 0 0 26px; color: #c8d8ec; }
    .btns { display: flex; gap: 12px; justify-content: center; flex-wrap: wrap; }
    a.btn {
      display: inline-block; padding: 13px 26px; border-radius: 999px; text-decoration: none;
      font-weight: 600; transition: transform .15s ease, box-shadow .15s ease;
    }
    a.btn:hover { transform: translateY(-2px); box-shadow: 0 12px 28px rgba(0,0,0,.3); }
    .btn--green { background: linear-gradient(135deg, #34d399, #16a34a); color: #06371c; }
    .btn--ghost { border: 2px solid rgba(255,255,255,.55); color: #fff; }
  </style>
</head>
<body>
  <div class="card">
    <div class="mark" aria-hidden="true">S</div>
    <p class="code">4<span>0</span>4</p>
    <h1>This page scurried away</h1>
    <p>Like a roach when the lights come on, the page you're looking for has vanished. Let's get you back somewhere useful.</p>
    <div class="btns">
      <a class="btn btn--green" href="https://serenetouch.ca/">Back to Home</a>
      <a class="btn btn--ghost" href="https://serenetouch.ca/index.html#services">Our Services</a>
      <a class="btn btn--ghost" href="tel:+14389886709">Call Us</a>
    </div>
  </div>
</body>
</html>
